name: Reviewer

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyGithub

      - name: Run Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import re
          from github import Github
          import google.generativeai as genai

          gemini_key = os.environ.get("GEMINI_API_KEY")
          gh_token = os.environ.get("GITHUB_TOKEN")
          pr_number_raw = os.environ.get("PR_NUMBER")
          pr_author = os.environ.get("PR_AUTHOR", "").strip()
          repo_name = os.environ.get("REPO_NAME", "").strip()

          if not gemini_key or not pr_number_raw or not gh_token or not repo_name:
              print("❌ ERRO: Variáveis de ambiente ausentes.")
              sys.exit(1)

          pr_number = int(pr_number_raw)
          gh = Github(gh_token)
          repo = gh.get_repo(repo_name)
          pr = repo.get_pull(pr_number)

          base_branch = pr.base.ref
          head_branch = pr.head.ref

          # 1. BLINDAGEM DE SEGURANÇA
          ALLOWED_ADMINS = ["Alekkzsx", "GuilhermeMoreira07"]
          pr_files = list(pr.get_files())
          pr_commits = list(pr.get_commits())
          files_changed = [f.filename for f in pr_files]

          if any(f.startswith(".github/") for f in files_changed) and pr_author not in ALLOWED_ADMINS:
              msg = f"⛔ **Violação de Segurança**: Apenas os administradores podem alterar configurações em .github/!"
              pr.create_issue_comment(msg)
              sys.exit(1)

          if base_branch == "main" and head_branch != "develop":
              msg = f"⛔ **Violação de Fluxo**: PRs para a `main` DEVEM vir da `develop`!"
              pr.create_issue_comment(msg)
              sys.exit(1)

          # 2. PREPARAÇÃO DO DIFF
          def sanitize_untrusted_text(text: str) -> str:
              if not text: return ""
              return text.replace("</", "&lt;/").replace("<", "&lt;")

          safe_pr_title = sanitize_untrusted_text(pr.title)
          safe_commits = [sanitize_untrusted_text(c.commit.message) for c in pr_commits]
          commits_str = "\n".join(f"- {c.strip()}" for c in safe_commits)

          IGNORED_EXTENSIONS = ('.png', '.jpg', '.pdf', '.lock', '.min.js', '.map')
          diff_entries = []
          for f in pr_files:
              if any(f.filename.lower().endswith(ext) for ext in IGNORED_EXTENSIONS): continue
              if f.status == 'removed': continue
              patch = (f.patch or "")[:6000]
              diff_entries.append(f"Arquivo: {f.filename}\nPatch:\n{sanitize_untrusted_text(patch)}")
          diff_text = "\n\n".join(diff_entries)[:60000]

          # 3. GEMINI API (FALLBACK DINÂMICO DE MODELOS 3.X)
          genai.configure(api_key=gemini_key)
          
          try:
              available_models = [m.name for m in genai.list_models() if 'generateContent' in m.supported_generation_methods]
          except Exception as e:
              print(f"Erro ao listar modelos: {e}")
              available_models = []
              
          preferred_order = [
              'models/gemini-3.8-flash',
              'models/gemini-3.7-flash',
              'models/gemini-3.5-flash',
              'models/gemini-3.1-pro',
              'models/gemini-3.0-flash',
              'models/gemini-2.5-flash',
              'models/gemini-2.0-flash'
          ]
          
          model_name = 'models/gemini-2.5-flash' # fallback absoluto
          for pref in preferred_order:
              if pref in available_models or pref.replace('models/', '') in available_models:
                  model_name = pref
                  break
          
          print(f"✅ Usando o modelo: {model_name}")
          
          system_instruction = """
          Você é o Reviewer Oficial de Código. Suas tarefas:
          1. Encontrar bugs, vulnerabilidades, exceções não tratadas e más práticas lógicas.
          2. Avaliar se o Título do PR e as Mensagens de Commit estão no formato Conventional Commits E estritamente em INGLÊS.
          Se houver BUGS graves ou falhas lógicas, responda [STATUS: REPROVADO].
          Se o código estiver bom, mas os commits/título estiverem mal formatados ou em português, não reprove! Responda [STATUS: APROVADO], porém sinalize na revisão que o comando !fix-commits deve ser usado.
          """

          prompt = f"""
          Pull Request: {safe_pr_title}
          Commits:
          {commits_str}
          Código Diff:
          {diff_text}

          Responda em PT-BR com o formato:
          ---GENERAL_REVIEW---
          ## 🔍 Reviewer - Code Review
          ### 🚦 Status
          [STATUS: APROVADO] ou [STATUS: REPROVADO]
          ### 📝 Título e Commits
          (Indique se estão em Inglês e no padrão Conventional. Se não estiverem, inclua EXATAMENTE o seguinte texto: "⚠️ Encontrei commits fora do padrão ou em português. Para que eu corrija tudo automaticamente em inglês e preserve sua autoria, responda a este PR com o comando: `!fix-commits`")
          ### ⚠️ Análise Técnica de Código
          (Apenas problemas de código, bugs, falhas de segurança. Se o código for seguro, não reprove por causa dos commits).
          """

          model = genai.GenerativeModel(model_name, system_instruction=system_instruction)
          try:
              response = model.generate_content(prompt)
              response_text = response.text
          except Exception as e:
              print(f"Erro no Gemini 3.1 Pro: {e}")
              sys.exit(1)

          review = response_text.replace("---GENERAL_REVIEW---", "").strip()
          is_reprovado = "[STATUS: REPROVADO]" in review.upper()
          event_type = "REQUEST_CHANGES" if is_reprovado else "APPROVE"

          pr.create_review(body=review, event=event_type)
          if is_reprovado:
              sys.exit(1)
          EOF
