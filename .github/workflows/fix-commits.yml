name: Fix Commits (ChatOps)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix-commits:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '!fix-commits')
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR details
        id: pr_data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obter branch do PR usando gh api
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "HEAD_REF=$(echo $PR_JSON | jq -r .head.ref)" >> $GITHUB_ENV
          echo "HEAD_REPO=$(echo $PR_JSON | jq -r .head.repo.full_name)" >> $GITHUB_ENV
          echo "PR_AUTHOR=$(echo $PR_JSON | jq -r .user.login)" >> $GITHUB_ENV
          echo "BASE_REF=$(echo $PR_JSON | jq -r .base.ref)" >> $GITHUB_ENV

      - name: Check permissions
        run: |
          ALLOWED_ADMINS="Alekkzsx GuilhermeMoreira07"
          COMMENTER="${{ github.event.comment.user.login }}"
          if [ "$COMMENTER" != "$PR_AUTHOR" ]; then
            if ! echo "$ALLOWED_ADMINS" | grep -w "$COMMENTER" > /dev/null; then
              echo "Apenas o autor do PR ou administradores podem executar o !fix-commits."
              gh pr comment ${{ github.event.issue.number }} --body "⛔ Acesso negado. Apenas @${PR_AUTHOR} ou admins podem usar este comando." --repo ${{ github.repository }}
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyGithub

      - name: Fix Commits using Gemini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import subprocess
          from github import Github
          import google.generativeai as genai

          gemini_key = os.environ.get("GEMINI_API_KEY")
          gh_token = os.environ.get("GITHUB_TOKEN")
          pr_number = int(os.environ.get("PR_NUMBER"))
          repo_name = os.environ.get("REPO_NAME")

          gh = Github(gh_token)
          repo = gh.get_repo(repo_name)
          pr = repo.get_pull(pr_number)

          pr_commits = list(pr.get_commits())
          
          # Extrai mensagens originais
          commit_data = []
          for c in pr_commits:
              commit_data.append({
                  "sha": c.sha,
                  "message": c.commit.message
              })

          genai.configure(api_key=gemini_key)
          
          try:
              available_models = [m.name for m in genai.list_models() if 'generateContent' in m.supported_generation_methods]
          except Exception:
              available_models = []
              
          preferred_order = [
              'models/gemini-3.8-flash', 'models/gemini-3.7-flash',
              'models/gemini-3.5-flash', 'models/gemini-3.1-pro',
              'models/gemini-3.0-flash', 'models/gemini-2.5-flash'
          ]
          
          model_name = 'models/gemini-2.5-flash'
          for pref in preferred_order:
              if pref in available_models or pref.replace('models/', '') in available_models:
                  model_name = pref
                  break
                  
          print(f"✅ Usando o modelo: {model_name}")
          model = genai.GenerativeModel(model_name)
          
          prompt = f"""
          Você receberá o Título atual do Pull Request e uma lista de mensagens de commit.
          Sua tarefa é reescrever todos eles OBRIGATORIAMENTE em INGLÊS seguindo as regras do Conventional Commits (ex: feat: add login button, fix: resolve null pointer).

          PR Title Original: {pr.title}
          Commits Originais JSON: {json.dumps(commit_data)}

          Devolva ESTRITAMENTE um objeto JSON válido no formato abaixo, sem formatação markdown ou texto extra:
          {{
            "new_pr_title": "feat: new title here",
            "commits": {{
              "sha_aqui": "feat: new message here",
              "outro_sha": "fix: another message here"
            }}
          }}
          """

          response = model.generate_content(prompt)
          try:
              clean_json = response.text.strip()
              if clean_json.startswith("```json"):
                  clean_json = clean_json[7:-3].strip()
              elif clean_json.startswith("```"):
                  clean_json = clean_json[3:-3].strip()
                  
              ai_data = json.loads(clean_json)
          except Exception as e:
              pr.create_issue_comment(f"❌ Erro ao decodificar a resposta da IA. O formato falhou: {e}")
              sys.exit(1)

          new_title = ai_data.get("new_pr_title")
          if new_title:
              pr.edit(title=new_title)

          # Para reescrever no shell, vamos salvar o dicionário
          with open("commit_mappings.json", "w") as f:
              json.dump(ai_data.get("commits", {}), f)
          
          EOF

      - name: Rewrite Git History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Executa um interactive rebase simulado para alterar apenas as mensagens preservando o autor original
          # Python script para rodar comandos git locais
          python - << 'EOF'
          import json
          import subprocess
          import sys

          with open("commit_mappings.json", "r") as f:
              mappings = json.load(f)

          # Vamos usar git filter-repo ou rebase interativo.
          # A forma mais robusta sem dependências complexas é criar um shell script para o GIT_SEQUENCE_EDITOR.
          # Porém, para simplicidade de pipeline, podemos iterar na base de rebase.
          
          # Descobre o commit base
          base_ref = "origin/${{ env.BASE_REF }}"
          
          try:
              for sha, new_msg in mappings.items():
                  # A forma segura e imutável do autor no git filter-branch:
                  # Mas filter-branch é obsoleto. Como não podemos usar iterativos facilmente de forma automatizada via shell puro sem dor de cabeça,
                  # O jeito moderno é git replace e git filter-repo, mas para CI/CD vamos fazer um truque:
                  pass
          except Exception as e:
              sys.exit(1)
          EOF
          
          # Um jeito eficiente de reescrever mensagens de uma branch inteira mantendo autoria é via git-filter-repo 
          # ou um script de filter-branch. Para evitar complexidade técnica de python em rebase, vamos rodar um bash script
          # usando git filter-branch.
          
          echo "Processando reescrita..."
          
          git filter-branch -f --msg-filter '
            MSG=$(cat)
            SHA=$GIT_COMMIT
            # Busca a nova mensagem no JSON. Se existir, usa ela, senão usa a antiga.
            NEW_MSG=$(python3 -c "import json; d=json.load(open('\''commit_mappings.json'\'')); print(d.get('\''$SHA'\'', '\''$MSG'\''))" 2>/dev/null)
            if [ -n "$NEW_MSG" ] && [ "$NEW_MSG" != "$MSG" ]; then
              echo "$NEW_MSG"
            else
              echo "$MSG"
            fi
          ' origin/${{ env.BASE_REF }}..HEAD

          git push origin HEAD:${{ env.HEAD_REF }} --force-with-lease
          
          gh pr comment ${{ github.event.issue.number }} --body "✅ **Magia Feita!** Seus commits e o título do PR foram convertidos para Inglês (Conventional Commits) mantendo sua autoria intacta! (Note: Lembre-se de rodar \`git pull --rebase\` na sua máquina)." --repo ${{ github.repository }}
