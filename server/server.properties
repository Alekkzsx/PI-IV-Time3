# ==============================================================================
# AGMRM Academic Portal - Native Java HTTP Server Configuration
# ==============================================================================
# Runtime configuration for ServidorHttpNativo.
# Port: 8080 (TCP)
# Host binding: 0.0.0.0 (all interfaces in dev; 127.0.0.1 behind reverse proxy)
# Backlog: 0 (system default queue length)
# ==============================================================================

# Server Network Configuration
server.port=8080
server.host=0.0.0.0
server.backlog=0
server.name=AGMRM-Native-HttpServer

# HTTP Protocol and Socket Tuning
server.protocol=HTTP/1.1
server.encoding=UTF-8
server.max_threads=16
server.request_timeout_ms=30000
server.max_request_body_bytes=65536

# CORS Policy Configuration
cors.allow_origin=*
cors.allow_methods=GET, POST, PUT, DELETE, OPTIONS
cors.allow_headers=Content-Type, Authorization
cors.max_age_seconds=86400

# Logging and Diagnostics
server.log_level=INFO
server.access_log=true
