name: pi_iv_time3
description: "A new Flutter project."
# A linha a seguir evita que o pacote seja publicado acidentalmente no
# pub.dev usando `flutter pub publish`. Isso é preferível para pacotes privados.
publish_to: 'none' # Remova esta linha se desejar publicar no pub.dev

# O trecho a seguir define a versão e o número de build da sua aplicação.
# Um número de versão consiste em três números separados por pontos, como 1.2.43,
# seguidos por um número de build opcional separado por um +.
# Tanto a versão quanto o número de build podem ser sobrescritos no flutter
# build especificando --build-name e --build-number, respectivamente.
# No Android, build-name é usado como versionName enquanto build-number é usado como versionCode.
# Leia mais sobre versionamento no Android em https://developer.android.com/studio/publish/versioning
# No iOS, build-name é usado como CFBundleShortVersionString enquanto build-number é usado como CFBundleVersion.
# Leia mais sobre versionamento no iOS em
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# No Windows, build-name é usado como as partes major, minor e patch
# das versões do produto e do arquivo, enquanto build-number é usado como o sufixo de build.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# As dependências especificam outros pacotes dos quais seu pacote precisa para funcionar.
# Para atualizar automaticamente as dependências do seu pacote para as versões mais
# recentes, considere executar `flutter pub upgrade --major-versions`. Como alternativa,
# as dependências podem ser atualizadas manualmente alterando os números de versão abaixo
# para a versão mais recente disponível no pub.dev. Para ver quais dependências possuem
# versões mais recentes disponíveis, execute `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # O trecho a seguir adiciona a fonte Cupertino Icons à sua aplicação.
  # Use com a classe CupertinoIcons para ícones no estilo iOS.
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.17

  # Vinculação da pasta mãe de Segurança Empresarial (security/)
  agmrm_security:
    path: ../security
  http: ^1.6.0
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # O pacote "flutter_lints" abaixo contém um conjunto de lints recomendados para
  # incentivar boas práticas de programação. O conjunto de lints fornecido pelo pacote é
  # ativado no arquivo `analysis_options.yaml` localizado na raiz do seu
  # pacote. Consulte esse arquivo para obter informações sobre como desativar regras
  # de lint específicas e ativar regras adicionais.
  flutter_lints: ^5.0.0

# Para informações sobre a parte genérica de Dart deste arquivo, consulte a
# página a seguir: https://dart.dev/tools/pub/pubspec

# A seção a seguir é específica para pacotes Flutter.
flutter:

  # A linha a seguir garante que a fonte Material Icons esteja
  # incluída na sua aplicação, para que você possa usar os ícones na
  # classe Icons do material.
  uses-material-design: true

  assets:
    - images/

  # Para adicionar assets à sua aplicação, adicione uma seção de assets, como esta:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # Um asset de imagem pode referir-se a uma ou mais "variantes" específicas de resolução; consulte
  # https://flutter.dev/to/resolution-aware-images

  # Para detalhes sobre a adição de assets a partir de dependências de pacotes, consulte
  # https://flutter.dev/to/asset-from-package

  # Para adicionar fontes personalizadas à sua aplicação, adicione uma seção fonts aqui,
  # nesta seção "flutter". Cada entrada nesta lista deve ter uma
  # chave family com o nome da família da fonte, e uma chave "fonts" com uma
  # lista fornecendo o asset e outros descritores para a fonte. Por
  # exemplo:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # Para detalhes sobre fontes a partir de dependências de pacotes,
  # consulte https://flutter.dev/to/font-from-package
