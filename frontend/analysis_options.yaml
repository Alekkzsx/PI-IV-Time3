# Este arquivo configura o analisador, que analisa estaticamente o código Dart
# para verificar erros, avisos e lints.
#
# Os problemas identificados pelo analisador são exibidos na interface de IDEs
# com suporte a Dart (https://dart.dev/tools#ides-and-editors). O analisador também
# pode ser invocado pela linha de comando executando `flutter analyze`.

# A linha a seguir ativa um conjunto de lints recomendados para aplicativos,
# pacotes e plugins Flutter, projetados para incentivar boas práticas de código.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  # As regras de lint aplicadas a este projeto podem ser personalizadas na
  # seção abaixo para desativar regras do arquivo `package:flutter_lints/flutter.yaml`
  # incluído acima ou para habilitar regras adicionais. Uma lista de todos os lints
  # disponíveis e sua documentação está publicada em https://dart.dev/lints.
  #
  # Em vez de desativar uma regra de lint para todo o projeto na seção
  # abaixo, ela também pode ser suprimida para uma única linha de código
  # ou para um arquivo Dart específico usando a sintaxe `// ignore: name_of_lint`
  # e `// ignore_for_file: name_of_lint` na linha ou no arquivo que
  # está produzindo o lint.
  rules:
    # avoid_print: false  # Descomente para desativar a regra `avoid_print`
    # prefer_single_quotes: true  # Descomente para habilitar a regra `prefer_single_quotes`

# Informações adicionais sobre este arquivo podem ser encontradas em
# https://dart.dev/guides/language/analysis-options
