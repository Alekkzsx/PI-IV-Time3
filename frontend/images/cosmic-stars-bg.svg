    <use href="#fivePointStar" fill="url(#goldLeaf)" />
    <!-- Metallic highlight facets -->
    <polygon points="0,-24 7,-7 0,0" fill="#FEF08A" opacity="0.8" />
    <polygon points="25,-7 11,4 0,0" fill="#CA8A04" opacity="0.6" />
